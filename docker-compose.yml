version: '3.8'

services:
  web:
    build: .
    image: indianaresourcemap:latest
    ports:
      - "5000:5000"
    volumes:
      - ./static:/app/static
      - ./templates:/app/templates
      - ./utilities/data:/app/utilities/data
    environment:
      - FLASK_ENV=production
      - PYTHONUNBUFFERED=1
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s
    deploy:
      update_config:
        order: start-first
        failure_action: rollback
      rollback_config:
        order: stop-first

  # Optional: Add a reverse proxy for production
  # Uncomment if you want nginx for SSL termination and better performance
